services:
  app:
    image: node:20-alpine
    container_name: rebec-match-api
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npm run prisma:migrate && npm run dev"
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    container_name: rebec-match-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    env_file:
      - .env
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      retries: 5

volumes:
  database-data: