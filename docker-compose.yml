version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: db-java
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rebecmatchapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: caiozika
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
