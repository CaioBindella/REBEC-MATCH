spring.application.name=rebecmatch-api

# Variaveis locais opcionais (arquivo .env na raiz do modulo, fora do controle de versao).
# Em producao/Docker os mesmos nomes sao lidos diretamente das variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]

# Banco de dados (MySQL 8 ou MariaDB). A senha nao possui valor padrao no codigo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/match_v2}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O esquema e definido exclusivamente pelas migracoes Flyway; o Hibernate apenas valida o mapeamento.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Segredo de assinatura dos tokens JWT: obrigatorio, sem valor padrao (minimo de 32 caracteres).
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.expiration-hours=${API_SECURITY_TOKEN_EXPIRATION_HOURS:1}

# Importacao automatizada de estudos do ReBEC/ICTRP.
rebecmatch.import.xml-url=${REBEC_XML_URL:https://raw.githubusercontent.com/CaioBindella/REBEC-MATCH/refs/heads/xml/RBR-ictrp-ALL.xml}
# Todo domingo a 00:00.
rebecmatch.import.cron=${REBEC_IMPORT_CRON:0 0 0 * * SUN}
# Executa uma importacao assim que a aplicacao inicia (util para um banco recem-criado).
rebecmatch.import.on-startup=${REBEC_IMPORT_ON_STARTUP:true}
