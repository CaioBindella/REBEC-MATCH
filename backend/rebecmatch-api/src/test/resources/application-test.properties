# Perfil de testes: banco H2 em memória (modo MySQL), esquema gerado a partir das entidades.
# As migrações Flyway usam sintaxe específica de MySQL/MariaDB e são validadas contra o banco real.
spring.datasource.url=jdbc:h2:mem:rebecmatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

api.security.token.secret=segredo-de-teste-com-pelo-menos-32-caracteres
rebecmatch.import.on-startup=false
